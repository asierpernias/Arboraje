<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Ramaje - multi-points L-System generator</title>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <span class="eyebrow">An L-systems plotter</span>
            <h1>Ramaje</h1>
            <p>Each "F" ramifies itself. Adjust the seed and let it grow.</p>
        </div>
 
        <div class="field">
            <label>Initial string (axiom)</label>
            <input type="text" id="cadena" value="F" spellcheck="false">
        </div>
 
        <div class="field">
            <label>Iterations <span class="val" id="iteracionesVal">3</span></label>
            <input type="range" id="iteraciones" min="1" max="8" step="1" value="3">
        </div>
 
        <div class="row2">
            <div class="field">
                <label>Origin points</label>
                <input type="number" id="value" min="1" max="80" value="6">
            </div>
            <div class="field">
                <label>Branch length</label>
                <input type="number" id="longitud" min="1" max="60" value="9">
            </div>
        </div>
 
        <div class="row2">
            <div class="field">
                <label>Canvas width</label>
                <input type="number" id="width" min="200" max="2000" value="800">
            </div>
            <div class="field">
                <label>Canvas height</label>
                <input type="number" id="height" min="200" max="2000" value="600">
            </div>
        </div>
 
        <div class="divider"></div>
 
        <button class="grow-btn" id="growBtn">Make it grow!</button>
        <div class="btn-row">
            <button class="ghost-btn" id="reseedBtn">New seed</button>
            <button class="ghost-btn" id="downloadBtn">Download PNG</button>
        </div>
 
        <div class="meta-line" id="metaLine">Ready · not generated yet</div>
    </aside>
 
    <main class="stage">
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
        <div class="empty-hint" id="emptyHint" style="position: absolute;">
            Click <b>Make it grow!</b> to expand the axiom and draw the lines over the canvas.
        </div>
    </main>
 
    <script src="script.js"></script>
</body>
</html>
